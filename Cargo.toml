[package]
name = "afterimage"
version = "0.2.1"
edition = "2024"
description = "A local-first Windows replay recorder and clip editor"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["ico","png"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tray-icon = "0.25"
wry = "0.57"
windows = { version = "0.62", features = ["Win32_Media_Audio","Win32_System_Com","Win32_System_Com_StructuredStorage","Win32_System_Variant","Win32_Media_KernelStreaming","Win32_Media_Multimedia","Win32_UI_Input_KeyboardAndMouse","Win32_UI_WindowsAndMessaging","Win32_System_Threading","Win32_Foundation","Win32_Security","Win32_System_JobObjects"] }

[build-dependencies]
tauri-winres = "0.3"

