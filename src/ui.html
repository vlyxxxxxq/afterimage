<style>
*{box-sizing:border-box}body{margin:0;background:#100d16;color:#f4effa;font:15px 'Segoe UI',sans-serif;color-scheme:dark}button,input,select{font:inherit;color:inherit}button,select,input:not([type=range]){background:#282231;border:1px solid #493b55;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover,button:focus-visible{border-color:#bd8ae8}button:disabled{opacity:.5;cursor:default}.primary{background:#d4aafb;color:#21132e;font-weight:650}header,nav,.row{display:flex;align-items:center;gap:10px}header{padding:12px 22px;border-bottom:1px solid #392c44;background:#191320;position:sticky;top:0;z-index:2}header strong{font-size:21px;margin-right:18px}svg{vertical-align:middle;margin-right:7px}nav button{border-color:transparent;background:transparent}.active{background:#4b305e}main{max-width:1500px;margin:auto;padding:20px 26px}.row{justify-content:space-between;flex-wrap:wrap}h1{font-size:28px;margin:0 0 14px}h2{font-size:16px}small,#info,#state{color:#ceb9dc}.rec{background:linear-gradient(115deg,#241a32,#3c2454 65%,#241934);border:1px solid #523769;padding:14px 18px;border-radius:10px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin-top:15px}.card{padding:0;overflow:hidden;text-align:left;background:#211b2a}.card img,.rail img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#2d2337}.card b,.card small{display:block;padding:6px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{padding-top:0}.editor{display:grid;grid-template-columns:160px 1fr;gap:14px}.rail{overflow:auto;max-height:52vh}.rail button{width:100%;padding:0;margin-bottom:8px;overflow:hidden;text-align:left}.rail span{display:block;padding:4px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.screen{height:clamp(180px,46vh,560px);display:flex;justify-content:center;align-items:center;background:#08060b;border-radius:9px;overflow:hidden}video{max-width:100%;height:100%;obje .card {transition:transform 140ms ease,border-color 140ms ease;content-visibility:auto;contain-intrinsic-size:auto 185px}
.card:hover{transform:translateY(-2px);border-color:#b082d1}

</style>
<header><strong class="brand"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path fill="#d9acff" d="M6 21 22 4 23 12ZM4 27 11 19 16 17 10 27ZM17 16 23 14 28 26 22 26Z"/></svg>Afterimage</strong><nav><button data-view="library">Library</button><button data-view="editor">Editor</button><button data-view="settings">Settings</button></nav><span style="margin-left:auto" id="state"></span><kbd id="shortcut"></kbd><div class="window-controls" role="group" aria-label="Window controls">
<button id="min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 16 16"><path d="M2 8.5h12"/></svg></button>
<button id="max" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 16 16"><path id="maxGlyph" d="M2.5 2.5h11v11h-11z"/></svg></button>
<button id="hide" title="Close to tray" aria-label="Close to tray"><svg viewBox="0 0 16 16"><path d="m2.5 2.5 11 11m0-11-11 11"/></svg></button></div></header>
<main><section id="library"><div class="row"><h1>Clip library</h1><button id="import">Import video</button></div><div class="rec row"><div><b id="ready">Starting recording…</b><br><small id="info"></small></div><div><button id="pause">Pause recording</button> <button class="primary" id="save">Save last 30s</button></div></div><div class="row"><div><button id="all">All clips</button> <button id="favorites">★ Favorites</button></div><div class="toolbar"><input id="search" aria-label="Search by title or tag" placeholder="Search titles or tags"><select id="sort" aria-label="Sort clips"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Title A–Z</option></select></div></div><div id="cards" class="grid"></div><p id="empty"></p></section>
<section id="editor" hidden><div class="row"><h1>Clip editor</h1><div class="detail-fields"><input id="title" aria-label="Clip title" maxlength="120"><input id="tags" aria-label="Clip tags, separated by commas" placeholder="Tags, comma separated"><button id="rename">Save details</button> <button id="star">☆ Favorite</button></div></div><div class="editor"><div class="rail"><h2>Recent clips</h2><div id="recent"></div></div><div><div class="screen"><video id="video" preload="metadata"></video></div><input type="range" min="0" max="1" step=".01" id="seek" aria-label="Playback position"><div class="controls"><button id="play">Play</button><button id="setIn">Set in</button><button id="setOut">Set out</button><button id="reset">Reset trim</button><span id="clock"></span></div><div id="strip"><div id="selection"></div><div id="playhead"></div><button class="handle" id="hin" aria-label="Trim start"></button><button class="handle" id="hout" aria-label="Trim end"></button></div><div class="precision">

<label>Out <input id="outTime" type="number" step=".001" min="0" aria-label="End in seconds"></label>
<button id="undo" title="Undo last edit (Ctrl+Z)">Undo</button><button id="redo" title="Redo edit (Ctrl+Y)">Redo</button>
<label><input id="loop" type="checkbox"> Loop selection</label>
<select id="speed" aria-label="Preview speed"><option value=".25">0.25× preview</option><option value=".5">0.5× preview</option><option selected value="1">1× preview</option><option value="1.5">1.5× preview</option><option value="2">2× preview</option></select>
</div><div class="row"><small id="times"></small><div><select id="shape" aria-label="Export frame"><option>Original frame</option><option>Vertical 9∶16</option><option>Square 1∶1</option></select> <label><input type="checkbox" id="mute">Mute audio</label> <select id="quality" aria-label="Export quality"><option value="balanced">Balanced</option><option value="high">High quality</option><option value="compact">Smaller file</option></select> <button id="export" class="primary">Export MP4</button></div></div></div></div></section>
<section id="settings" hidden><h1>Capture settings</h1><form id="pref" class="form"><label for="secs">Replay length</label><select id="secs"></select><label for="fps">Frame rate</label><select id="fps"></select><label for="height">Resolution limit</label><select id="height"></select><label for="key">Save shortcut</label><select id="key"></select><label for="monitor">Display</label><select id="monitor"></select><label for="audio">System audio</label><input type="checkbox" id="audio"><button class="primary">Save settings</button></form><button class="gap" id="folder">Open clips folder</button></section></main><div role="status" id="status"></div>
<script>
const el=id=>document.getElementById(id), send=(cmd,extra={})=>window.ipc.postMessage(JSON.stringify({cmd,...extra})),v=el('video');
const undoStack=[],redoStack=[];
let animation=0;
let clips=[],selected,view='library',fav=false,a=0,b=0,prefs={},lastRows='',settingsHash='',version=0;
const text=(id,value)=>{const node=el(id);if(node.textContent!==value)node.textContent=value}, fmt=t=>Number.isFinite(t)?Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'):'0:00.0';
function page(p){if(p==='editor'&&!selected){if(clips.length){openClip(clips[0]);return}text('status','Save or import a clip to start editing.');return}view=p;for(const n of ['library','editor','settings'])el(n).hidden=n!==p;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===p));if(p!=='editor')v.pause()}
document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>page(x.dataset.view));
function card(c,rail){const btn=document.createElement('button');btn.className=rail?'':'card';let img=new Image();img.alt='';img.loading='lazy';img.src='/thumb/'+c.id+'?v='+version;btn.append(img);let name=document.createElement(rail?'span':'b');name.textContent=(c.star?'★  ':'')+c.title;btn.append(name);if(!rail){let dt=document.createElement('small');dt.textContent=c.date.slice(0,16).replace('T','  ·  ');btn.append(dt);
    if(c.tags?.length){const group=document.createElement('div');group.className='tag-list';
    for(const tag of c.tags){const chip=document.createElement('span');chip.textContent=tag;group.append(chip)}btn.append(group)}
}btn.onclick=()=>openClip(c);return btn}
function render(){const words=el('search').value.trim().toLowerCase().split(/\s+/);
const list=clips.filter(c=>{const fields=[c.title,...(c.tags||[])].join(' ').toLowerCase();return (!fav||c.star)&&words.every(word=>fields.includes(word))});
const order=el('sort').value;list.sort((x,y)=>order==='name'?x.title.localeCompare(y.title):order==='old'?x.date.localeCompare(y.date):y.date.localeCompare(x.date));el('cards').replaceChildren(...list.map(c=>card(c,false)));el('recent').replaceChildren(...clips.slice(0,15).map(c=>card(c,true)));text('empty',list.length?'':clips.length?'No matching clips.':'Press your save shortcut to keep your first clip.');el('all').classList.toggle('active',!fav);el('favorites').classList.toggle('active',fav)}
function openClip(c){undoStack.length=redoStack.length=0;el('tags').value=(c.tags||[]).join(', ');selected=c;v.pause();a=b=0;el('title').value=c.title;text('star',c.star?'★ Favorite':'☆ Favorite');el('strip').style.backgroundImage='none';v.src='/video/'+c.id;send('strip',{id:c.id});page('editor')}
function options(id,values,fn){el(id).replaceChildren(...values.map(v=>new Option(fn(v),v)))}
options('secs',[15,30,45,60,90,120],x=>x+' seconds');options('fps',[30,60],x=>x+' fps');options('height',[720,1080,1440],x=>x+'p');options('key',Array.from({length:12},(_,i)=>i+1),x=>'Ctrl + Shift + F'+x);
window.update=s=>{document.documentElement.classList.toggle('max',s.maximized);el('max').title=s.maximized?'Restore down':'Maximize';el('max').setAttribute('aria-label',el('max').title);el('maxGlyph').setAttribute('d',s.maximized?'M5 2.5h8.5V11H11 M2.5 5h8.5v8.5H2.5z':'M2.5 2.5h11v11h-11z');prefs=s.settings;text('state',s.running?'● Recording':'○ Recording off');text('shortcut',s.bound?'Ctrl + Shift + F'+prefs.Key:'Shortcut unavailable');text('ready',s.running?s.ready+'s ready to clip':'Recording is off');text('info',s.audioError?'System audio unavailable':prefs.Audio?'Display + system audio':'Display only');text('pause',s.wants?'Pause recording':'Start recording');text('save',s.saving?'Saving…':'Save last '+prefs.Seconds+'s');el('save').disabled=!s.ready||s.saving;el('export').disabled=s.busy;el('import').disabled=s.busy;text('status',s.message);const sh=JSON.stringify([prefs,s.displays]);if(sh!==settingsHash){settingsHash=sh;options('monitor',s.displays.map((_,i)=>i),i=>s.displays[i]);for(const [id,k] of [['secs','Seconds'],['fps','Fps'],['height','Height'],['key','Key'],['monitor','Monitor']])el(id).value=prefs[k];el('audio').checked=prefs.Audio}};
window.library=rows=>{clips=rows;let hash=JSON.stringify(rows.map(c=>[c.id,c.title,c.star,c.tags]));if(lastRows!==hash){lastRows=hash;render()}if(selected){selected=clips.find(x=>x.id===selected.id);if(selected)text('star',selected.star?'★ Favorite':'☆ Favorite')}};
window.art=(id,kind)=>{if(kind==='strip'&&selected?.id===id)el('strip').style.backgroundImage='url("/strip/'+id+'?v='+Date.now()+'")';if(kind==='thumb')document.querySelectorAll('img').forEach(img=>{if(img.src.includes('/thumb/'+id))img.src='/thumb/'+id+'?v='+Date.now()})};
function position(){
    if(!Number.isFinite(v.duration)||!v.duration)return;
    el('seek').value=v.currentTime;
    el('playhead').style.left=(100*v.currentTime/v.duration)+'%';
    text('clock',fmt(v.currentTime)+' / '+fmt(v.duration));
}
function draw(){if(!v.duration)return;position();
    el('inTime').value=a.toFixed(3);el('outTime').value=b.toFixed(3);
    el('undo').disabled=!undoStack.length;el('redo').disabled=!redoStack.length;const left=100*a/v.duration,right=100*b/v.duration;el('hin').style.left=el('selection').style.left=left+'%';el('hout').style.left=right+'%';el('selection').style.width=(right-left)+'%';text('times',fmt(a)+' – '+fmt(b)+'  ·  '+fmt(b-a));const ratio=[0,9/16,1][el('shape').selectedIndex];v.style.width=ratio?'min(100%, '+Math.round(v.parentElement.clientHeight*ratio)+'px)':'100%';v.style.objectFit=ratio?'cover':'contain';v.muted=el('mute').checked}
function cut(){return {In:a,Out:b,Shape:el('shape').selectedIndex,Mute:el('mute').checked}}
let previousCut;
function draft(remember=true){
    if(!selected||!v.duration)return;
    const next=cut();
    if(remember===true&&previousCut && JSON.stringify(previousCut)!==JSON.stringify(next)){
        undoStack.push(previousCut);if(undoStack.length>80)undoStack.shift();redoStack.length=0;
    }
    previousCut=next;selected.draft=next;send('draft',{id:selected.id,draft:next});draw()
}
function historyEdit(from,to){
    if(!from.length)return;
    v.pause();to.push(cut());const d=from.pop();a=d.In;b=d.Out;
    el('shape').selectedIndex=d.Shape;el('mute').checked=d.Mute;
    v.currentTime=Math.max(a,Math.min(b,v.currentTime));draft(false)
}
el('undo').onclick=()=>historyEdit(undoStack,redoStack);
el('redo').onclick=()=>historyEdit(redoStack,undoStack);
for(const [id,start] of [['inTime',true],['outTime',false]]){
    el(id).onchange=()=>{let t=el(id).valueAsNumber;
        if(!Number.isFinite(t)||!v.duration){draw();return}
        v.pause();
        if(start){a=Math.max(0,Math.min(b-Math.min(.01,b),t));v.currentTime=a}
        else{b=Math.min(v.duration,Math.max(a+.01,t));v.currentTime=b}
        draft()
    }
}
function boundary(){
    if(v.currentTime<b || !v.duration)return;
    if(el('loop').checked){v.currentTime=a;if(v.paused)v.play().catch(()=>{})}
    else{v.pause();v.currentTime=a}
}
function animate(){
    if(v.paused||document.hidden)return;
    boundary();position();
    if(!v.paused)animation=requestAnimationFrame(animate)
}
function startAnimation(){cancelAnimationFrame(animation);animate()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!v.paused)startAnimation()});
el('speed').onchange=()=>{v.playbackRate=Number(el('speed').value)};
v.onended=boundary;
v.onloadedmetadata=()=>{const d=selected?.draft||{};a=Math.max(0,d.In||0);b=Math.min(v.duration,d.Out||v.duration);if(b<=a){a=0;b=v.duration}el('shape').selectedIndex=d.Shape||0;el('mute').checked=!!d.Mute;el('seek').max=v.duration;v.currentTime=a;previousCut=cut();v.playbackRate=Number(el('speed').value);draw()};v.ontimeupdate=()=>{if(!v.paused)boundary();position()};v.onerror=()=>text('status','Preview could not open this video.');v.onplay=()=>{text('play','Pause');startAnimation()};v.onpause=()=>{cancelAnimationFrame(animation);text('play','Play')};el('play').onclick=()=>{if(v.paused){if(v.currentTime<a||v.currentTime>=b-.03)v.currentTime=a;v.play().catch(e=>text('status',e.message))}else v.pause()};el('seek').oninput=e=>v.currentTime=+e.target.value;
el('setIn').onclick=()=>{a=Math.max(0,Math.min(v.currentTime,b-.05));draft()};el('setOut').onclick=()=>{b=Math.min(v.duration,Math.max(v.currentTime,a+.05));draft()};el('reset').onclick=()=>{a=0;b=v.duration;draft()};
for(const [id,left] of [['hin',true],['hout',false]]){let h=el(id);h.onpointerdown=e=>{v.pause();h.setPointerCapture(e.pointerId);e.stopPropagation()};h.onpointermove=e=>{if(!h.hasPointerCapture(e.pointerId)||!v.duration)return;let r=el('strip').getBoundingClientRect(),t=Math.max(0,Math.min(v.duration,(e.clientX-r.left)/r.width*v.duration));if(left){a=Math.max(0,Math.min(t,b-.05));v.currentTime=a}else{b=Math.min(v.duration,Math.max(t,a+.05));v.currentTime=b}draw()};h.onlostpointercapture=()=>draft()}
el('strip').onpointerdown=e=>{if(e.target.classList.contains('handle')||!v.duration)return;let r=el('strip').getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*v.duration};el('shape').onchange=el('mute').onchange=()=>draft();window.onresize=draw;
el('all').onclick=()=>{fav=false;render()};el('favorites').onclick=()=>{fav=true;render()};el('search').oninput=render;el('sort').onchange=render;
for(const [id,cmd] of [['save','save'],['pause','toggle'],['import','import'],['folder','folder']])el(id).onclick=()=>send(cmd);
el('star').onclick=()=>send('star',{id:selected.id});el('rename').onclick=()=>send('rename',{id:selected.id,title:el('title').value,tags:el('tags').value.split(',').map(t=>t.trim()).filter(Boolean)});el('export').onclick=()=>send('export',{id:selected.id,start:a,end:b,shape:el('shape').selectedIndex,mute:v.muted,quality:el('quality').value});
el('pref').onsubmit=e=>{e.preventDefault();send('settings',{settings:{Seconds:+el('secs').value,Fps:+el('fps').value,Height:+el('height').value,Key:+el('key').value,Monitor:+el('monitor').value,Audio:el('audio').checked}})};
window.onkeydown=e=>{
    if(view!=='editor'||!v.duration||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
    const k=e.key.toLowerCase();
    if(e.ctrlKey&&['z','y'].includes(k)){
        e.preventDefault();el(k==='y'||e.shiftKey?'redo':'undo').click();return
    }
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    if(k===' '&&e.target.closest('button'))return;
    const id={' ':'play','i':'setIn','o':'setOut'}[k];
    if(id){e.preventDefault();el(id).click()}
    if(k==='arrowleft'||k==='arrowright'){v.pause();const step=e.shiftKey ? .01 : .1;v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+(k==='arrowleft'?-step:step)));e.preventDefault()}
};
const header=document.querySelector('header');
const draggable=e=>!e.target.closest('button,input,select,a,.window-controls');
let dragOrigin=null;
header.onpointerdown=e=>{if(e.button===0&&draggable(e))dragOrigin=[e.screenX,e.screenY]};
header.onpointermove=e=>{if(!e.buttons){dragOrigin=null;return}if(dragOrigin&&Math.hypot(e.screenX-dragOrigin[0],e.screenY-dragOrigin[1])>=4){dragOrigin=null;send('window-drag')}};
window.addEventListener('pointerup',()=>dragOrigin=null);
header.ondblclick=e=>{if(draggable(e))send('window-maximize')};
for(const [id,cmd] of [['min','minimize'],['max','maximize'],['hide','hide']])el(id).onclick=()=>send('window-'+cmd);
for(const side of ['n','s','e','w','ne','nw','se','sw']){const edge=document.createElement('div');edge.className='edge'+(side.length===2?' corner':'');edge.dataset.side=side;edge.setAttribute('aria-hidden','true');edge.onpointerdown=e=>{if(e.button===0){e.preventDefault();send('window-resize',{edge:side})}};document.body.append(edge)}
page('library');send('init');
</script></html>
