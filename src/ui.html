<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterimage</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d16;color:#f4effa;font:15px 'Segoe UI',sans-serif;color-scheme:dark}button,input,select{font:inherit;color:inherit}button,select,input:not([type=range]){background:#282231;border:1px solid #493b55;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover,button:focus-visible{border-color:#bd8ae8}button:disabled{opacity:.5;cursor:default}.primary{background:#d4aafb;color:#21132e;font-weight:650}header,nav,.row{display:flex;align-items:center;gap:10px}header{padding:12px 22px;border-bottom:1px solid #392c44;background:#191320;position:sticky;top:0;z-index:2}header strong{font-size:21px;margin-right:18px}svg{vertical-align:middle;margin-right:7px}nav button{border-color:transparent;background:transparent}.active{background:#4b305e}main{max-width:1500px;margin:auto;padding:20px 26px}.row{justify-content:space-between;flex-wrap:wrap}h1{font-size:28px;margin:0 0 14px}h2{font-size:16px}small,#info,#state{color:#ceb9dc}.rec{background:linear-gradient(115deg,#241a32,#3c2454 65%,#241934);border:1px solid #523769;padding:14px 18px;border-radius:10px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin-top:15px}.card{padding:0;overflow:hidden;text-align:left;background:#211b2a}.card img,.rail img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#2d2337}.card b,.card small{display:block;padding:6px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{padding-top:0}.editor{display:grid;grid-template-columns:160px 1fr;gap:14px}.rail{overflow:auto;max-height:52vh}.rail button{width:100%;padding:0;margin-bottom:8px;overflow:hidden;text-align:left}.rail span{display:block;padding:4px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.screen{height:clamp(180px,46vh,560px);display:flex;justify-content:center;align-items:center;background:#08060b;border-radius:9px;overflow:hidden}video{max-width:100%;height:100%;object-fit:contain}#strip{position:relative;height:52px;background:#302538 center/100% 100% no-repeat;margin:10px 8px;touch-action:none;cursor:crosshair}#selection{position:absolute;top:0;bottom:0;border:2px solid #d5a3ff;pointer-events:none}.handle{position:absolute;border:0;background:#d8aaff;width:12px;padding:0;top:0;bottom:0;transform:translateX(-50%);cursor:ew-resize;touch-action:none}input[type=range]{accent-color:#c78ded}#seek{width:100%;margin:6px 0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls span{margin-left:auto;font-variant-numeric:tabular-nums}#status{position:sticky;bottom:0;background:#19131f;color:#e0c6ed;padding:8px 26px;min-height:32px}#status:empty{display:none}.form{display:grid;grid-template-columns:160px minmax(170px,280px);align-items:center;gap:14px}.gap{margin-top:14px}[hidden]{display:none!important}#empty{padding:55px 0;text-align:center;color:#c0b0cc}kbd{font:13px Consolas;color:#d9c3e4}#search{min-width:150px}.brand{white-space:nowrap}@media(max-width:850px){.editor{grid-template-columns:110px 1fr}header{gap:3px}header strong{margin-right:0}}
header{user-select:none;padding:0 0 0 20px;height:54px;background:linear-gradient(106deg,#25182f,#1a1324 55%,#24152e)}.window-controls{display:flex;align-self:stretch;margin-left:7px}.window-controls button{display:grid;place-items:center;width:43px;padding:0;border:0;border-radius:0;background:transparent}.window-controls button:hover{background:#392943}.window-controls #hide:hover{background:#a13b59}.window-controls svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.2;margin:0}.window-controls button:focus-visible{outline:2px solid #dbacff;outline-offset:-3px}.edge{position:fixed;z-index:10}.max .edge{display:none}.edge[data-side=n],.edge[data-side=s]{height:4px;left:6px;right:6px;cursor:ns-resize}.edge[data-side=n]{top:0}.edge[data-side=s]{bottom:0}.edge[data-side=w],.edge[data-side=e]{width:4px;top:6px;bottom:6px;cursor:ew-resize}.edge[data-side=w]{left:0}.edge[data-side=e]{right:0}.corner{width:7px;height:7px}.edge[data-side=nw]{top:0;left:0;cursor:nwse-resize}.edge[data-side=ne]{top:0;right:0;cursor:nesw-resize}.edge[data-side=sw]{bottom:0;left:0;cursor:nesw-resize}.edge[data-side=se]{bottom:0;right:0;cursor:nwse-resize}
</style>
<header><strong class="brand"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path fill="#d9acff" d="M6 21 22 4 23 12ZM4 27 11 19 16 17 10 27ZM17 16 23 14 28 26 22 26Z"/></svg>Afterimage</strong><nav><button data-view="library">Library</button><button data-view="editor">Editor</button><button data-view="settings">Settings</button></nav><span style="margin-left:auto" id="state"></span><kbd id="shortcut"></kbd><div class="window-controls" role="group" aria-label="Window controls">
<button id="min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 16 16"><path d="M2 8.5h12"/></svg></button>
<button id="max" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 16 16"><path id="maxGlyph" d="M2.5 2.5h11v11h-11z"/></svg></button>
<button id="hide" title="Close to tray" aria-label="Close to tray"><svg viewBox="0 0 16 16"><path d="m2.5 2.5 11 11m0-11-11 11"/></svg></button></div></header>
<main><section id="library"><div class="row"><h1>Clip library</h1><button id="import">Import video</button></div><div class="rec row"><div><b id="ready">Starting recording…</b><br><small id="info"></small></div><div><button id="pause">Pause recording</button> <button class="primary" id="save">Save last 30s</button></div></div><div class="row"><div><button id="all">All clips</button> <button id="favorites">★ Favorites</button></div><input id="search" aria-label="Search clip titles" placeholder="Search clips"></div><div id="cards" class="grid"></div><p id="empty"></p></section>
<section id="editor" hidden><div class="row"><h1>Clip editor</h1><div><input id="title" aria-label="Clip title" maxlength="120"><button id="rename">Rename</button> <button id="star">☆ Favorite</button></div></div><div class="editor"><div class="rail"><h2>Recent clips</h2><div id="recent"></div></div><div><div class="screen"><video id="video" preload="metadata"></video></div><input type="range" min="0" max="1" step=".01" id="seek" aria-label="Playback position"><div class="controls"><button id="play">Play</button><button id="setIn">Set in</button><button id="setOut">Set out</button><button id="reset">Reset trim</button><span id="clock"></span></div><div id="strip"><div id="selection"></div><button class="handle" id="hin" aria-label="Trim start"></button><button class="handle" id="hout" aria-label="Trim end"></button></div><div class="row"><small id="times"></small><div><select id="shape" aria-label="Export frame"><option>Original frame</option><option>Vertical 9∶16</option><option>Square 1∶1</option></select> <label><input type="checkbox" id="mute">Mute audio</label> <button id="export" class="primary">Export MP4</button></div></div></div></div></section>
<section id="settings" hidden><h1>Capture settings</h1><form id="pref" class="form"><label for="secs">Replay length</label><select id="secs"></select><label for="fps">Frame rate</label><select id="fps"></select><label for="height">Resolution limit</label><select id="height"></select><label for="key">Save shortcut</label><select id="key"></select><label for="monitor">Display</label><select id="monitor"></select><label for="audio">System audio</label><input type="checkbox" id="audio"><button class="primary">Save settings</button></form><button class="gap" id="folder">Open clips folder</button></section></main><div role="status" id="status"></div>
<script>
const el=id=>document.getElementById(id), send=(cmd,extra={})=>window.ipc.postMessage(JSON.stringify({cmd,...extra})),v=el('video');
let clips=[],selected,view='library',fav=false,a=0,b=0,prefs={},lastRows='',settingsHash='',version=0;
const text=(id,value)=>el(id).textContent=value, fmt=t=>Number.isFinite(t)?Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'):'0:00.0';
function page(p){if(p==='editor'&&!selected){if(clips.length){openClip(clips[0]);return}text('status','Save or import a clip to start editing.');return}view=p;for(const n of ['library','editor','settings'])el(n).hidden=n!==p;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===p));if(p!=='editor')v.pause()}
document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>page(x.dataset.view));
function card(c,rail){const btn=document.createElement('button');btn.className=rail?'':'card';let img=new Image();img.alt='';img.loading='lazy';img.src='/thumb/'+c.id+'?v='+version;btn.append(img);let name=document.createElement(rail?'span':'b');name.textContent=(c.star?'★  ':'')+c.title;btn.append(name);if(!rail){let dt=document.createElement('small');dt.textContent=c.date.slice(0,16).replace('T','  ·  ');btn.append(dt)}btn.onclick=()=>openClip(c);return btn}
function render(){const list=clips.filter(c=>(!fav||c.star)&&c.title.toLowerCase().includes(el('search').value.toLowerCase()));el('cards').replaceChildren(...list.map(c=>card(c,false)));el('recent').replaceChildren(...clips.slice(0,15).map(c=>card(c,true)));text('empty',list.length?'':clips.length?'No matching clips.':'Press your save shortcut to keep your first clip.');el('all').classList.toggle('active',!fav);el('favorites').classList.toggle('active',fav)}
function openClip(c){selected=c;v.pause();a=b=0;el('title').value=c.title;text('star',c.star?'★ Favorite':'☆ Favorite');el('strip').style.backgroundImage='none';v.src='/video/'+c.id;send('strip',{id:c.id});page('editor')}
function options(id,values,fn){el(id).replaceChildren(...values.map(v=>new Option(fn(v),v)))}
options('secs',[15,30,45,60,90,120],x=>x+' seconds');options('fps',[30,60],x=>x+' fps');options('height',[720,1080,1440],x=>x+'p');options('key',Array.from({length:12},(_,i)=>i+1),x=>'Ctrl + Shift + F'+x);
window.update=s=>{document.documentElement.classList.toggle('max',s.maximized);el('max').title=s.maximized?'Restore down':'Maximize';el('max').setAttribute('aria-label',el('max').title);el('maxGlyph').setAttribute('d',s.maximized?'M5 2.5h8.5V11H11 M2.5 5h8.5v8.5H2.5z':'M2.5 2.5h11v11h-11z');prefs=s.settings;text('state',s.running?'● Recording':'○ Recording off');text('shortcut',s.bound?'Ctrl + Shift + F'+prefs.Key:'Shortcut unavailable');text('ready',s.running?s.ready+'s ready to clip':'Recording is off');text('info',s.audioError?'System audio unavailable':prefs.Audio?'Display + system audio':'Display only');text('pause',s.wants?'Pause recording':'Start recording');text('save','Save last '+prefs.Seconds+'s');el('save').disabled=!s.ready||s.busy;el('export').disabled=s.busy;el('import').disabled=s.busy;text('status',s.message);const sh=JSON.stringify([prefs,s.displays]);if(sh!==settingsHash){settingsHash=sh;options('monitor',s.displays.map((_,i)=>i),i=>s.displays[i]);for(const [id,k] of [['secs','Seconds'],['fps','Fps'],['height','Height'],['key','Key'],['monitor','Monitor']])el(id).value=prefs[k];el('audio').checked=prefs.Audio}};
window.library=rows=>{clips=rows;let hash=JSON.stringify(rows.map(c=>[c.id,c.title,c.star]));if(lastRows!==hash){lastRows=hash;render()}if(selected){selected=clips.find(x=>x.id===selected.id);if(selected)text('star',selected.star?'★ Favorite':'☆ Favorite')}};
window.art=(id,kind)=>{if(kind==='strip'&&selected?.id===id)el('strip').style.backgroundImage='url("/strip/'+id+'?v='+Date.now()+'")';if(kind==='thumb')document.querySelectorAll('img').forEach(img=>{if(img.src.includes('/thumb/'+id))img.src='/thumb/'+id+'?v='+Date.now()})};
function draw(){if(!v.duration)return;el('seek').value=v.currentTime;text('clock',fmt(v.currentTime)+' / '+fmt(v.duration));const left=100*a/v.duration,right=100*b/v.duration;el('hin').style.left=el('selection').style.left=left+'%';el('hout').style.left=right+'%';el('selection').style.width=(right-left)+'%';text('times',fmt(a)+' – '+fmt(b)+'  ·  '+fmt(b-a));const ratio=[0,9/16,1][el('shape').selectedIndex];v.style.width=ratio?'min(100%, '+Math.round(v.parentElement.clientHeight*ratio)+'px)':'100%';v.style.objectFit=ratio?'cover':'contain';v.muted=el('mute').checked}
function draft(){if(!selected||!v.duration)return;const d={In:a,Out:b,Shape:el('shape').selectedIndex,Mute:el('mute').checked};selected.draft=d;send('draft',{id:selected.id,draft:d});draw()}
v.onloadedmetadata=()=>{const d=selected?.draft||{};a=Math.max(0,d.In||0);b=Math.min(v.duration,d.Out||v.duration);if(b<=a){a=0;b=v.duration}el('shape').selectedIndex=d.Shape||0;el('mute').checked=!!d.Mute;el('seek').max=v.duration;v.currentTime=a;draw()};v.ontimeupdate=()=>{if(!v.paused&&v.currentTime>=b){v.pause();v.currentTime=a}draw()};v.onerror=()=>text('status','Preview could not open this video.');v.onplay=()=>text('play','Pause');v.onpause=()=>text('play','Play');el('play').onclick=()=>{if(v.paused){if(v.currentTime<a||v.currentTime>=b-.03)v.currentTime=a;v.play().catch(e=>text('status',e.message))}else v.pause()};el('seek').oninput=e=>v.currentTime=+e.target.value;
el('setIn').onclick=()=>{a=Math.max(0,Math.min(v.currentTime,b-.05));draft()};el('setOut').onclick=()=>{b=Math.min(v.duration,Math.max(v.currentTime,a+.05));draft()};el('reset').onclick=()=>{a=0;b=v.duration;draft()};
for(const [id,left] of [['hin',true],['hout',false]]){let h=el(id);h.onpointerdown=e=>{v.pause();h.setPointerCapture(e.pointerId);e.stopPropagation()};h.onpointermove=e=>{if(!h.hasPointerCapture(e.pointerId)||!v.duration)return;let r=el('strip').getBoundingClientRect(),t=Math.max(0,Math.min(v.duration,(e.clientX-r.left)/r.width*v.duration));if(left){a=Math.max(0,Math.min(t,b-.05));v.currentTime=a}else{b=Math.min(v.duration,Math.max(t,a+.05));v.currentTime=b}draw()};h.onpointerup=draft}
el('strip').onpointerdown=e=>{if(e.target.classList.contains('handle')||!v.duration)return;let r=el('strip').getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*v.duration};el('shape').onchange=el('mute').onchange=draft;window.onresize=draw;
el('all').onclick=()=>{fav=false;render()};el('favorites').onclick=()=>{fav=true;render()};el('search').oninput=render;
for(const [id,cmd] of [['save','save'],['pause','toggle'],['import','import'],['folder','folder']])el(id).onclick=()=>send(cmd);
el('star').onclick=()=>send('star',{id:selected.id});el('rename').onclick=()=>send('rename',{id:selected.id,title:el('title').value});el('export').onclick=()=>send('export',{id:selected.id,start:a,end:b,shape:el('shape').selectedIndex,mute:v.muted});
el('pref').onsubmit=e=>{e.preventDefault();send('settings',{settings:{Seconds:+el('secs').value,Fps:+el('fps').value,Height:+el('height').value,Key:+el('key').value,Monitor:+el('monitor').value,Audio:el('audio').checked}})};
window.onkeydown=e=>{if(view!=='editor'||['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;let id={' ':'play','i':'setIn','o':'setOut'}[e.key];if(id){e.preventDefault();el(id).click()}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){v.pause();v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+(e.key==='ArrowLeft'?-.1:.1)));e.preventDefault()}};
const header=document.querySelector('header');
const draggable=e=>!e.target.closest('button,input,select,a,.window-controls');
let dragOrigin=null;
header.onpointerdown=e=>{if(e.button===0&&draggable(e))dragOrigin=[e.screenX,e.screenY]};
header.onpointermove=e=>{if(!e.buttons){dragOrigin=null;return}if(dragOrigin&&Math.hypot(e.screenX-dragOrigin[0],e.screenY-dragOrigin[1])>=4){dragOrigin=null;send('window-drag')}};
window.addEventListener('pointerup',()=>dragOrigin=null);
header.ondblclick=e=>{if(draggable(e))send('window-maximize')};
for(const [id,cmd] of [['min','minimize'],['max','maximize'],['hide','hide']])el(id).onclick=()=>send('window-'+cmd);
for(const side of ['n','s','e','w','ne','nw','se','sw']){const edge=document.createElement('div');edge.className='edge'+(side.length===2?' corner':'');edge.dataset.side=side;edge.setAttribute('aria-hidden','true');edge.onpointerdown=e=>{if(e.button===0){e.preventDefault();send('window-resize',{edge:side})}};document.body.append(edge)}
page('library');send('init');
</script></html>
